# Local / single-host deployment: BastionVault + PostgreSQL.
#   cp .env.example .env   # fill in, never commit .env
#   docker compose up -d
#   docker compose logs bastion-vault | grep "setup token"   # first start only
#
# In the homelab, BastionVault runs in Kubernetes against the shared PostgreSQL
# server instead; this file is for development and for single-host setups.

services:
  postgres:
    image: postgres:16
    container_name: bastion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bastionvault
      POSTGRES_USER: bastionvault
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - bastion-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bastionvault -d bastionvault"]
      interval: 10s
      timeout: 5s
      retries: 5

  bastion-vault:
    image: sarthakg0yal/bastionvault:${BASTIONVAULT_VERSION:-0.2}
    container_name: bastion-vault
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/bastionvault
      DB_USERNAME: bastionvault
      DB_PASSWORD: ${DB_PASSWORD}
      VAULT_COOKIE_SECURE: ${VAULT_COOKIE_SECURE:-false}
      VAULT_TRUSTED_PROXIES: ${VAULT_TRUSTED_PROXIES:-127\.0\.0\.1}
      # Optional auto-unseal: mount the key file and point at it.
      VAULT_UNSEAL_KEY_FILE: ${VAULT_UNSEAL_KEY_FILE:-}

volumes:
  bastion-db-data:
