server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: bastionvault
  # THE FIX: Spring Boot 4.x uses 'spring.mongodb', NOT 'spring.data.mongodb'
  mongodb:
    uri: ${MONGO_URI:mongodb://localhost:27017/bastion}
      
  vaadin:
    productionMode: false

vault:
  salt: ${VAULT_SALT:local-dev-salt}
  deployment-token: ${VAULT_DEPLOYMENT_TOKEN:local-dev-token}