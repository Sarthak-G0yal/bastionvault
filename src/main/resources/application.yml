server:
  port: 8080
  error:
    include-message: always

spring:
  application:
    name: bastion-vault
  
  # MongoDB Connection
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/bastion}

  # Vaadin Production / Development Mode settings
  vaadin:
    productionMode: false

# Custom Application Security Properties
vault:
  # The salt used to turn your Master Password into an AES key
  salt: ${VAULT_SALT}
  # Pre-shared static token for stateless automation scripts (Terraform/Ansible)
  deployment-token: ${VAULT_DEPLOYMENT_TOKEN}